name: Release

# Opens/updates a release PR from Conventional Commits. Merging it bumps package.json,
# updates CHANGELOG.md and tags the release. The version is shown in-game and in version.json.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          release-type: node
